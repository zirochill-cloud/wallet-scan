# SolScope scoring configuration
# ---------------------------------------------------------------------------
# Every weight, threshold and constant used by the scoring model lives here.
# Nothing is hardcoded in the scorer. See docs/05-scoring-methodology.md for the
# rationale behind each value.
#
# FREEZE RULE: set `frozen: true` and commit before any validation run.
# Weights changed after seeing validation results invalidate the validation.

version: "1.1.0"   # 1.1.0: Phase 1b early-entry re-weighting + hit_multiple to diagnostic
frozen: false

# ---------------------------------------------------------------------------
# Dimension weights. MUST sum to 1.0 exactly (asserted at load time).
# Confidence is deliberately NOT here: it is reported and applied separately.
# ---------------------------------------------------------------------------
weights:
  early_entry:         0.25   # the stated primary objective
  integrity:           0.15   # main defence against coordinated-wallet false positives
  profitability:       0.15
  repeatability:       0.15
  risk:                0.10
  token_selection:     0.10
  exit_effectiveness:  0.10

# ---------------------------------------------------------------------------
# Hard gates. A gate excludes a wallet from ranking entirely, regardless of score.
# ---------------------------------------------------------------------------
gates:
  integrity_min: 30            # below this: likely insider/operator, not a transferable signal
  confidence_min: 25           # below this: too little evidence to rank at all
  min_closed_positions: 5      # below this: report as unscored, not scored-zero
  exclude_when_data_reason_unknown: true

# ---------------------------------------------------------------------------
# Recommendation bands, applied to confidence_adjusted_score (descending).
# ---------------------------------------------------------------------------
bands:
  track:         75
  watch:         60
  investigate:   45
  deprioritize:   0            # anything below `investigate`

# ---------------------------------------------------------------------------
# Shrinkage: shrunk = (n/(n+k))*observed + (k/(n+k))*prior
# Continuous penalty for small samples. Preferred over a hard <N-trades cliff
# because it degrades smoothly and cannot be gamed by adding one filler trade.
# ---------------------------------------------------------------------------
shrinkage:
  prior: 50                    # neutral prior for 0-100 normalised inputs
  k:
    early_entry: 5             # needs ~5 anchors to reach half-weight (distinct anchors, not metric rows)
    profitability: 12
    repeatability: 8
    risk: 6
    token_selection: 5         # ~5 benchmarked positions to reach half-weight
    exit_effectiveness: 12
    integrity: 0               # penalties are rate-based; no shrinkage

# ---------------------------------------------------------------------------
# Dimension 1 — Early-entry ability
#
# Phase 1b weighting. Source: docs/PHASE1A_RECOVERY.md §5, operationalised in
# docs/PHASE1B_SCOPING.md Q4. Direction settled by the Q7 age distribution:
# median age 1 day, IQR 2 days, 86% of mints under 7 days. In a population that
# young, an age curve has almost no dynamic range left to discriminate on, so
# age is retained as a diagnostic instead of scored.
#
#   weight_max_subsequent_return          0.40  continuous, magnitude
#   weight_buyer_rank_at_entry            0.30  replaces token_age_at_entry
#   weight_pct_entries_before_volume_spike 0.30
#   weight_mcap                           0.00  deferred, see below
#   weight_token_age                      0.00  diagnostic only, see below
#
# Sub-weights must sum to 1.0 (asserted by tests/test_scoring_config.py).
# ---------------------------------------------------------------------------
early_entry:
  weight_max_subsequent_return: 0.40
  weight_buyer_rank_at_entry: 0.30
  weight_pct_entries_before_volume_spike: 0.30
  weight_mcap: 0.00            # retained, deferred — no historical supply source
  weight_token_age: 0.00       # retained, diagnostic only

  # --- diagnostics: weight 0.00, reported but never scored -----------------

  # age_i = 100 * 2^(-age_hours / half_life_hours)
  # NOT scored: see the Q7 distribution above. Retained so reports can show it,
  # and so a future population with real age spread can re-enable it cheaply.
  # NOTE: this is MINT age. swaps.token_age_seconds is POOL age
  # (event_time - pool.created_at) and must not be substituted for it.
  age_half_life_hours: 12      # 0h->100, 12h->50, 24h->25, 48h->6

  # mcap_i = 100 * (1 - log(mcap/ref) / log(ceiling/ref)), clamped [0,100]
  # NOT scored: needs circulating supply at the entry instant, which no free
  # source provides. Scoring it would make early-entry a function of data
  # availability rather than of behaviour.
  mcap_reference_usd: 50000    # at or below this: full credit
  mcap_ceiling_usd: 2000000    # at or above this: zero credit

  # --- max_subsequent_return (0.40) ---------------------------------------
  # peak SWAP-implied price / entry price, over N days after entry.
  # Report every N in the list; the headline N is the one quoted in prose.
  max_subsequent_return_windows_days: [1, 7, 30]
  max_subsequent_return_headline_days: 30
  # If entry is less than N days old, report this marker for that N.
  # NEVER impute or silently shorten the window: a truncated window compares
  # different horizons across wallets without saying so.
  insufficient_window_marker: "INSUFFICIENT_WINDOW"
  # Also report peak_day: integer day-of-peak measured from entry.
  report_peak_day: true

  # --- buyer_rank_at_entry (0.30) -----------------------------------------
  # Ordinal rank by first-buy timestamp among unique buyers EVER observed for
  # the mint (1 = first buyer). The ordinal value is a DIAGNOSTIC; the score
  # uses the percentile, because rank 3 of 10 and rank 3 of 2,000 are not
  # comparable achievements.
  # Requires a COMPLETE buyer set. If completeness cannot be demonstrated,
  # report not-computed rather than ranking a sample — a rank over a sample is
  # a property of the sampling, not of the wallet.
  buyer_rank_use_percentile_for_score: true
  buyer_rank_percentile_definition: "rank / total_unique_buyers"

  # --- pct_entries_before_volume_spike (0.30) -----------------------------
  # "spike" = the first hour where mint hourly volume >= spike_multiple x the
  # rolling 24h median hourly volume, EXCLUDING the first hour.
  # Report the fraction of the wallet's entries preceding that spike.
  # If no spike occurs, ALL entries count as before-spike (nothing is
  # post-spike). The alternative penalises wallets for a quiet market.
  # Computable from swap deltas + timestamps; needs no external volume feed.
  spike_multiple: 3.0
  spike_rolling_median_hours: 24
  spike_exclude_first_hours: 1
  no_spike_counts_all_as_before: true

  # An entry only counts toward early-entry credit if the token had a real market.
  # This is what stops "first 2 transactions of every rug" scoring as skill.
  min_liquidity_usd_for_credit: 3000
  junk_entry_liquidity_floor_usd: 1000   # below this: counted as a junk entry, reported

# ---------------------------------------------------------------------------
# Dimension 2 — Profitability
# ---------------------------------------------------------------------------
profitability:
  weight_median_roi: 0.50
  weight_profit_factor: 0.30
  weight_magnitude: 0.20       # log-scaled and capped so whales cannot dominate

  # roi_component = 100 / (1 + exp(-median_roi / tau))
  # tau 0.5 => -100%->12, -50%->27, 0%->50, +50%->73, +100%->88
  roi_logistic_tau: 0.50

  # profit_factor_component = 100 * min(PF, cap)/cap
  profit_factor_cap: 5.0

  # magnitude_component = 100 * clamp(log10(1+usd)/log10(1+scale), 0, 1)
  magnitude_log_scale_usd: 100000

# ---------------------------------------------------------------------------
# Dimension 3 — Repeatability
# Down-weights correlated positions before counting them.
# ---------------------------------------------------------------------------
repeatability:
  weight_effective_n: 0.35
  weight_win_rate: 0.30
  weight_temporal_dispersion: 0.20
  weight_regime_coverage: 0.15

  # Effective sample size (Kish): n_eff = (sum w)^2 / sum w^2
  # w_i = 1 / (1 + c_i); c_i = other positions by this wallet that share a token
  # or that were opened in the same slot/bundle as another of its positions.
  independence_same_token_weight: 1.0
  independence_same_slot_weight: 1.0

  n_eff_full_credit: 15

  # Normalised Shannon entropy of closed positions across calendar months,
  # divided by log(number of months in the collection window).
  temporal_dispersion_months_min: 1

  # Share of distinct launch-week cohorts the wallet has entries in.
  regime_min_distinct_weeks: 3

# ---------------------------------------------------------------------------
# Dimension 4 — Risk management
# Uses MARK-TO-MARKET equity, so "never sells a loser" cannot fake low drawdown.
# ---------------------------------------------------------------------------
risk:
  weight_drawdown: 0.30
  weight_tail: 0.25
  weight_loss_ratio: 0.20
  weight_concentration: 0.15
  weight_failure_rate: 0.10

  # drawdown_component = 100 * exp(-max_drawdown / scale)
  drawdown_scale: 0.60         # 0%->100, 30%->61, 60%->37, 100%->19

  # tail_component = 100 / (1 + exp(-(p_pct + center)/scale)) on ROI
  tail_percentile: 5           # 5th percentile of closed-position returns
  tail_logistic_center: -0.60
  tail_logistic_scale: 0.20

  # loss_ratio_component = 100 * clamp((avg_win/avg_loss)/target, 0, 1)
  loss_ratio_target: 3.0

  # concentration_component from HHI of cost basis
  # = 100 * clamp((ceiling - HHI)/(ceiling - ideal), 0, 1)
  hhi_ideal: 0.05              # diversified
  hhi_ceiling: 0.50            # effectively all capital in one token

  # failure_component = 100 * (1 - failed_tx_rate)
  failure_rate_penalty_ceiling: 0.50   # rates above this floor the component at 0

# ---------------------------------------------------------------------------
# Dimension 5 — Token selection
# Benchmarked against the cohort of tokens launched in the same week, so that
# wallets are comparable across periods and across market conditions.
#
# DOUBLE-COUNT RESOLUTION (docs/PHASE1A_RECOVERY.md §5, docs/PHASE1B_SCOPING.md Q4).
# Forward appreciation is owned by early_entry.weight_max_subsequent_return.
# The hit_multiple >= 3.0 construct measures the SAME signal with a binary
# threshold, so it is removed from the weighted score and kept as a diagnostic.
# Scoring both would double-reward appreciation, and the binary half
# structurally favours a wallet with a few large wins over one with consistent
# mid-sized wins — the opposite of "repeatable performance across multiple
# tokens rather than one lucky trade" (requirements §A).
#
# cohort_excess absorbs the freed weight, so the dimension still sums to 1.0
# while continuing to score token QUALITY (did the chosen tokens beat their
# launch-week peers?) rather than re-scoring how far they ran.
#
# DEFINED, NOT ASSUMED (checked 2026-10-28, the Item-4 verification):
# docs/05-scoring-methodology.md §9 gives the full operational definition --
#   excess_i = log(1 + multiple_i) - log(1 + cohort_median_multiple)
#   cohort_excess_component = 100 / (1 + exp(-mean(excess_i) / scale))
# with cohort = tokens launched in the same week (fallback: all_tokens below
# benchmark_min_cohort_n), and schema/001_init.sql's cohort_benchmarks table
# stores those medians with available_at gating the point-in-time read (a
# benchmark computed over a full 30d window is not readable on day 1 of it).
# Its input is the same 30d swap-derived multiple that
# early_entry.weight_max_subsequent_return consumes -- the same data
# dependency, not a new one. That is why this weight is 1.00 rather than
# DEFERRED: both the definition and its storage exist. DEFER this to 0.00 only
# if cohort_benchmarks goes away or the S3 price series cannot populate it.
#
# Do not re-weight hit_rate without first zeroing
# early_entry.weight_max_subsequent_return.
# ---------------------------------------------------------------------------
token_selection:
  weight_cohort_excess: 1.00   # was 0.60; absorbs the weight freed below
  weight_hit_rate: 0.00        # retained, DIAGNOSTIC ONLY — see the note above

  benchmark_kind: launch_week
  benchmark_forward_window_days: 30
  benchmark_min_cohort_n: 10   # cohorts smaller than this fall back to all_tokens

  # excess_i = log(1+multiple_i) - log(1+cohort_median_multiple)
  # component = 100 / (1 + exp(-mean_excess / scale))
  cohort_excess_logistic_scale: 0.50

  # --- diagnostic only (weight_hit_rate = 0.00) ---------------------------
  # hit = token reached >= hit_multiple * entry mcap within the window.
  # Reported for interpretation; NOT part of the score.
  hit_multiple: 3.0
  hit_rate_full_credit: 0.25   # a 25% hit rate earns full marks

# ---------------------------------------------------------------------------
# Dimension 6 — Exit effectiveness
# Capture is only assessed where a favourable exit actually existed.
# ---------------------------------------------------------------------------
exit_effectiveness:
  weight_capture: 0.60
  weight_adverse: 0.25
  weight_impact: 0.15

  observation_windows_hours: [1, 6, 24, 168, 720]

  # capture_i = realized_return / max_favorable_return, clamped [0,1]
  # Excluded (not zero) when max_favorable_return <= 0: no opportunity existed.
  capture_requires_positive_opportunity: true

  # A closed loser exited after the token had already fallen this far from entry.
  adverse_exit_drawdown_pct: 0.80

  # Fraction of profitable exits that were realistically achievable at size.
  realistic_impact_threshold: 0.01   # position value <= 1% of pool liquidity

# ---------------------------------------------------------------------------
# Dimension 7 — Behavioral integrity
# Starts at 100 and subtracts RATE-BASED penalties. This is a hygiene score,
# not a performance score. It is evidence of coordination, never proof of it.
# ---------------------------------------------------------------------------
integrity:
  base_score: 100
  penalties:
    launcher_affiliated:        40   # bought in the launch tx, fee paid by deployer,
                                     # or within the first 4 txs after launch
    same_slot_cohort:           25   # buys sharing a slot or Jito bundle with >=2 wallets
    common_funder_cluster:      15   # shares a first funder with >=2 wallets
    sniper_bot_signature:       20   # median hold < 2 min AND >= 30 trades
    wash_trade_signature:       30   # self-matching / circular SOL flows
    fresh_wallet_sophistication: 10  # wallet < 24h old behaving like a specialist
    concentration_then_dump:    20   # held > 20% of float, then exited heavily

  # Multi-wallet heuristics must exclude exchange/service funders, or every
  # unrelated user of the same exchange appears coordinated.
  exclude_exchange_funders: true
  exchange_funder_allowlist: []      # populated from observed high-fanout funders

  sniper_median_hold_seconds: 120
  sniper_min_trades: 30
  launch_affiliation_first_n_txs: 4

# ---------------------------------------------------------------------------
# Dimension 8 — Data confidence (reported separately, then applied).
# ---------------------------------------------------------------------------
confidence:
  weight_coverage: 0.30          # share of the window's activity actually decoded
  weight_price_provenance: 0.25  # share of entries priced from the swap itself
  weight_sample: 0.20            # effective sample size
  weight_recency: 0.15           # days since last observed trade
  weight_metadata: 0.10          # share of tokens with resolved mint metadata

  sample_full_credit_n_eff: 30
  recency_half_life_days: 60
  coverage_cap_below: 0.50       # coverage under this caps confidence at `coverage_cap_value`
  coverage_cap_value: 40
  interpolated_price_cap_above: 0.50   # mostly interpolated prices cap confidence here
  interpolated_price_cap_value: 50

# ---------------------------------------------------------------------------
# Confidence gate (Option 3): the two Phase 1b anchor factors GATE ranking; they
# are not blended into confidence. A wallet ranks only if all three pass.
# `existing_min` mirrors gates.confidence_min and is repeated here because this
# conjunction is the ranking decision, while `gates` is the legacy flat list.
# Until §12's five confidence components exist, existing_confidence is 0.00 for
# every wallet, so gate_passed is False and nothing ranks. That is intentional.
# ---------------------------------------------------------------------------
confidence_gate:
  existing_min: 25             # existing_confidence (0-100) must reach this
  sample_min: 0.30             # anchor_sample_size in [0,1]; 0.30 = at least 3 anchors
  coverage_min: 0.50           # anchor_coverage in [0,1]; at least half measured

# ---------------------------------------------------------------------------
# Ranking and clustering
# ---------------------------------------------------------------------------
ranking:
  min_wallets_for_percentiles: 50   # below this, percentiles are suppressed
  cluster_dedup: true               # cluster members count as ONE signal
  cluster_independence_mode: sqrt   # independence_factor = 1/sqrt(cluster_size)
  max_per_cluster_in_top_n: 2

# ---------------------------------------------------------------------------
# Sensitivity / "what would change this score"
# Recompute the overall score with one metric moved to its next-band value.
# ---------------------------------------------------------------------------
sensitivity:
  enabled: true
  top_n: 3                    # report the 3 largest effects
  min_score_delta: 1.0        # ignore noise below this
